<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ToDo List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Organização</p>
          <h1>Minhas Tarefas</h1>
        </div>
        <span class="status-pill">Online</span>
      </header>

      <main class="layout">
        <section class="panel form-panel">
          <div class="panel-header">
            <h2 id="form-title">Nova tarefa</h2>
          </div>

          <form id="task-form" class="task-form">
            <label class="input-group">
              <span>Título</span>
              <input
                id="task-title"
                name="title"
                type="text"
                placeholder="Ex: Estudar React"
                maxlength="120"
                required
              />
            </label>

            <label class="input-group">
              <span>Descrição</span>
              <textarea
                id="task-description"
                name="description"
                rows="3"
                placeholder="Descreva os detalhes da tarefa..."
                maxlength="500"
              ></textarea>
            </label>

            <label class="input-group">
              <span>Status</span>
              <select id="task-status" name="status">
                <option value="pendente">Pendente</option>
                <option value="em andamento">Em andamento</option>
                <option value="concluída">Concluída</option>
              </select>
            </label>

            <div class="form-actions">
              <button type="submit" class="primary-btn" id="submit-button">Salvar tarefa</button>
              <button type="button" class="secondary-btn hidden" id="cancel-edit">Cancelar</button>
            </div>
          </form>
        </section>

        <section class="panel list-panel">
          <div class="panel-header list-header">
            <h2>Lista</h2>
            <div class="summary" id="summary">
              <span>Total: <strong id="total-count">0</strong></span>
              <span>Pendentes: <strong id="pending-count">0</strong></span>
              <span>Concluídas: <strong id="done-count">0</strong></span>
            </div>
          </div>

          <div id="tasks-container" class="tasks-container" aria-live="polite"></div>
        </section>
      </main>
    </div>

    <template id="task-card-template">
      <article class="task-card">
        <div class="task-top">
          <div class="task-title-block">
            <h3 class="task-title"></h3>
            <span class="task-date"></span>
          </div>
          <span class="task-status"></span>
        </div>

        <p class="task-description"></p>

        <div class="task-actions">
          <button class="toggle-status-btn" type="button">Marcar como concluída</button>
          <button class="edit-btn" type="button">Editar</button>
          <button class="delete-btn" type="button">Excluir</button>
        </div>
      </article>
    </template>

    <script src="./script.js"></script>
  </body>
</html>
